services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ev_apm
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ev_apm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/ev_apm
      REDIS_URL: redis://redis:6379
      ML_API_URL: ${ML_API_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  ml:
    build:
      context: ./ml
    container_name: ev-apm-ml
    ports:
      - "8001:8001"

volumes:
  pgdata:
